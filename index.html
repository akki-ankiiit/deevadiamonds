<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>DEEVA | Lab Grown Diamonds</title>
    <meta
      name="description"
      content="DEEVA creates IGI-certified lab-grown diamond jewellery in BIS-hallmarked gold — rings, earrings, pendants, necklaces and bracelets, fully customised. Visit our Raipur boutique."
    />
    <meta name="theme-color" content="#0f2e20" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DEEVA Lab Grown Diamonds" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="DEEVA | Lab Grown Diamonds" />
    <meta
      property="og:description"
      content="IGI-certified lab-grown diamond jewellery in BIS-hallmarked gold. Fully customised. Raipur."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEEVA — Lab Grown Diamond" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DEEVA | Lab Grown Diamonds" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link
      rel="preload"
      href="/fonts/CormorantGaramond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/DMSans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/images/deeva/hero-720.avif 720w, /images/deeva/hero-1200.avif 1200w, /images/deeva/hero-1800.avif 1800w, /images/deeva/hero-2400.avif 2400w"
      imagesizes="(min-width: 900px) 58vw, 100vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JewelryStore",
        "name": "DEEVA | Lab Grown Diamond",
        "alternateName": "Deeva Diamonds",
        "description": "IGI-certified lab-grown diamond jewellery in BIS-hallmarked gold. Fully customised rings, earrings, pendants, necklaces and bracelets.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/brand/deeva-horizontal-gold.svg",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "telephone": "+91-92016-61918",
        "priceRange": "From ₹20,000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "First Floor, Currency Tower, VIP Road",
          "addressLocality": "Raipur",
          "addressRegion": "Chhattisgarh",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:30",
          "closes": "21:30"
        },
        "sameAs": [
          "https://www.instagram.com/deeva.diamonds/",
          "https://youtube.com/@deeva_lgds"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        DEEVA — Lab Grown Diamond. First Floor, Currency Tower, VIP Road,
        Raipur. WhatsApp +91 92016 61918.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
